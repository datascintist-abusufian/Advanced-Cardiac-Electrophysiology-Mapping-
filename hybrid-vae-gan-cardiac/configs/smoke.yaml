data:
  raw_dir: work/synthetic_acdc
  cache_dir: work/synthetic_processed
  image_size: 64
  num_classes: 4
  min_foreground_pixels: 1
cv:
  n_splits: 2
  seeds: [42]
  validation_fraction: 0.25
  stratify_by_diagnosis: false
train:
  epochs_seg: 1
  epochs_vae: 1
  epochs_gan: 1
  batch_size_seg: 2
  batch_size_gen: 2
  patience: 1
  num_workers: 0
  amp: false
model:
  latent_dim: 8
  base_channels: 8
  dropout: 0.1
  latent_noise_std: 0.1
qc:
  ssim_min: 0.0
  ssim_max: 1.0
  anatomy_dice_min: 0.0
  fid_max: 1000000.0
  target_synthetic: 4
  candidate_multiplier: 1
  min_retained: 2
output_dir: work/smoke_runs
device: cpu
conditions: [baseline, geometric, vae, gan, hybrid_no_qc, hybrid_qc]

