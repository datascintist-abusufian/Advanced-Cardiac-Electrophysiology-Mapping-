data:
  raw_dir: data/raw/ACDC/database/training
  cache_dir: data/processed
  image_size: 256
  num_classes: 4
  min_foreground_pixels: 0
  include_ed_es_only: true
cv:
  n_splits: 5
  seeds: [42, 1337, 2026]
  validation_fraction: 0.15
  stratify_by_diagnosis: true
train:
  epochs_seg: 100
  epochs_vae: 200
  epochs_gan: 200
  batch_size_seg: 8
  batch_size_gen: 16
  lr_seg: 0.0001
  lr_g: 0.0001
  lr_d: 0.0004
  weight_decay: 0.00001
  patience: 15
  num_workers: 4
  amp: true
model:
  latent_dim: 128
  base_channels: 32
  dropout: 0.2
  vae_beta: 1.0
  latent_noise_std: 0.1
  gan_l1_weight: 100.0
qc:
  ssim_min: 0.5
  ssim_max: 0.995
  anatomy_dice_min: 0.7
  fid_max: 50.0
  target_synthetic: 200
  candidate_multiplier: 2
  min_retained: 25
output_dir: runs
device: auto
conditions: [baseline, geometric, vae, gan, hybrid_no_qc, hybrid_qc]

