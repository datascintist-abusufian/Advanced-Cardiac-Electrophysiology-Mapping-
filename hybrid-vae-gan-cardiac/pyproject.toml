[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-vae-gan-cardiac"
version = "0.1.0"
description = "Reproducible hybrid generative augmentation for ACDC cardiac MRI segmentation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3", "numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3",
  "nibabel>=5.2,<6", "scikit-learn>=1.4,<2", "scikit-image>=0.22,<1",
  "matplotlib>=3.8,<4", "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["cardiac_aug*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

